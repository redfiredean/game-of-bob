<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game of Bob</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; overflow: hidden; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Camera
let cameraX = 0;

// Death wall
let deathWallWorldX = 0;
let deathWallSpikes = [];

function getWallSpeed() {
  const levelBase = 1.3 + (currentLevel - 1) * 0.38;
  const seconds = Math.floor(gameTime / 60);
  return Math.min(13, levelBase + seconds * 0.03);
}

function getWallSpeedFraction() {
  return Math.min(1, (getWallSpeed() - 1.3) / 11.7);
}

function createDeathWallSpikes() {
  deathWallSpikes = [];
  for (let y = 50; y < canvas.height - 30; y += 55)
    deathWallSpikes.push({ y, phase: Math.random() * Math.PI * 2 });
}

function getWallSpikeH(phase) {
  const pulse = Math.max(0, Math.sin(gameTime * 0.022 + phase));
  return 20 + (8 + getDiff() * 35) * pulse;
}

function drawDeathWall() {
  const wallSX = deathWallWorldX - cameraX;

  // Solid wall body from left edge to wall face
  if (wallSX > 0) {
    ctx.fillStyle = '#0d0505';
    ctx.fillRect(0, 0, wallSX, canvas.height);
  }

  // Pulsing glow — widens and brightens as wall speeds up
  if (wallSX > -160 && wallSX < canvas.width + 20) {
    const sf = getWallSpeedFraction();
    const glowW = 90 + sf * 120;
    const gx = Math.max(0, wallSX);
    const grad = ctx.createLinearGradient(gx - glowW, 0, gx, 0);
    grad.addColorStop(0, 'rgba(180,0,0,0)');
    const g = Math.round(30 - sf * 30);
    const alpha = 0.3 + sf * 0.45 + 0.15 * Math.sin(gameTime * 0.07);
    grad.addColorStop(1, `rgba(220,${g},30,${alpha.toFixed(2)})`);
    ctx.fillStyle = grad;
    ctx.fillRect(Math.max(0, gx - glowW), 0, glowW, canvas.height);
  }

  // Spikes on leading edge
  if (wallSX > -60 && wallSX < canvas.width + 60) {
    ctx.lineWidth = 1;
    for (const s of deathWallSpikes) {
      const h = getWallSpikeH(s.phase);
      const pulse = (h - 20) / 63;
      const r = Math.round(180 + pulse * 75), g = Math.round(50 - pulse * 50);
      ctx.fillStyle = `rgb(${r},${g},30)`;
      ctx.strokeStyle = `rgb(${Math.round(r * 0.6)},0,0)`;
      ctx.beginPath();
      ctx.moveTo(wallSX, s.y - 12);
      ctx.lineTo(wallSX + h, s.y);
      ctx.lineTo(wallSX, s.y + 12);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
}

function updateCamera() {
  const target = bob.worldX - canvas.width * 0.35;
  cameraX += (target - cameraX) * 0.1;
  cameraX = Math.max(0, cameraX);
}

function getScreenX() { return bob.worldX - cameraX; }

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  createSpikes();
  createDeathWallSpikes();
  bob.worldX = cameraX + canvas.width * 0.35;
  bob.y = canvas.height / 2;
}
window.addEventListener('resize', resizeCanvas);

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSqueak() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
  osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
  osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.2);
}

function playPop() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'square';
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
  osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.15);
}

function playRespawn() {
  [0, 100, 200].forEach((delay, i) => {
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400 + i * 200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.12);
    }, delay);
  });
}

// Background music
let musicOn = false;
let musicManuallyStopped = false; // true only when user explicitly pressed the button
let musicStarted = false;         // have we ever kicked off the audio loop?
const MELODY = [
  [220,0.15],[246.94,0.15],[261.63,0.15],[293.66,0.15],
  [329.63,0.2],[293.66,0.15],[261.63,0.15],[246.94,0.15],
  [220,0.2],[0,0.1],[196,0.15],[220,0.15],
  [246.94,0.2],[220,0.15],[196,0.15],[174.61,0.3]
];

function scheduleMusic(startTime) {
  if (!musicOn) return;
  let t = startTime;
  const masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.06;
  masterGain.connect(audioCtx.destination);
  for (const [freq, dur] of MELODY) {
    if (freq === 0) { t += dur; continue; }
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(1, t + 0.01);
    g.gain.linearRampToValueAtTime(0, t + dur * 0.85);
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + dur);
    t += dur;
  }
  // Bass drone
  const drone = audioCtx.createOscillator();
  const dg = audioCtx.createGain();
  drone.type = 'sawtooth'; drone.frequency.value = 55;
  dg.gain.setValueAtTime(0.035, startTime);
  dg.gain.linearRampToValueAtTime(0, t - 0.05);
  drone.connect(dg); dg.connect(audioCtx.destination);
  drone.start(startTime); drone.stop(t);
  // Schedule next loop
  const totalDur = t - startTime;
  setTimeout(() => scheduleMusic(audioCtx.currentTime + 0.05), (totalDur - 0.2) * 1000);
}

function startMusic() {
  if (musicOn || audioCtx.state === 'suspended') return;
  musicOn = true;
  musicStarted = true;
  scheduleMusic(audioCtx.currentTime + 0.1);
}

// Called on every tap to auto-start music unless user explicitly stopped it
function autoStartMusic() {
  if (musicManuallyStopped || musicStarted) return;
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().then(startMusic);
  } else {
    startMusic();
  }
}

function stopMusic() { musicOn = false; }

// Bob the rag doll
const bob = {
  worldX: 0,
  y: 300,
  vx: 0,
  vy: 0,
  scale: 1,
  opacity: 1,
  alive: true,
  respawnTimer: 0,
  wobble: 0,
  wobbleSpeed: 0,
  headRadius: 28,
  bodyWidth: 36,
  bodyHeight: 50,
  armLength: 40,
  legLength: 45,
};

function getBobParts() {
  const x = getScreenX();
  const { y, scale } = bob;
  const w = bob.wobble;
  return {
    head: { x: x + Math.sin(w) * 2, y: y - 65 * scale, r: bob.headRadius * scale },
    nose: { x: x + Math.sin(w) * 2 + 2 * scale, y: y - 62 * scale, r: 6 * scale },
    body: { x: x, y: y - 20 * scale, w: bob.bodyWidth * scale, h: bob.bodyHeight * scale },
    leftArm: { x1: x - 18 * scale, y1: y - 38 * scale, x2: x - 38 * scale + Math.sin(w + 1) * 8, y2: y + 5 * scale },
    rightArm: { x1: x + 18 * scale, y1: y - 38 * scale, x2: x + 38 * scale + Math.sin(w + 2) * 8, y2: y + 5 * scale },
    leftLeg: { x1: x - 10 * scale, y1: y + 28 * scale, x2: x - 20 * scale + Math.sin(w) * 5, y2: y + 72 * scale },
    rightLeg: { x1: x + 10 * scale, y1: y + 28 * scale, x2: x + 20 * scale + Math.sin(w + 1.5) * 5, y2: y + 72 * scale },
    leftHand: { x: x - 38 * scale + Math.sin(w + 1) * 8, y: y + 5 * scale, r: 7 * scale },
    rightHand: { x: x + 38 * scale + Math.sin(w + 2) * 8, y: y + 5 * scale, r: 7 * scale },
    leftFoot: { x: x - 20 * scale + Math.sin(w) * 5, y: y + 72 * scale, r: 8 * scale },
    rightFoot: { x: x + 20 * scale + Math.sin(w + 1.5) * 5, y: y + 72 * scale, r: 8 * scale },
  };
}

function drawBob() {
  if (!bob.alive) return;
  ctx.globalAlpha = bob.opacity;
  const p = getBobParts();
  const lw = 4 * bob.scale;

  ctx.strokeStyle = '#5b8c5a'; ctx.lineWidth = lw + 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(p.leftLeg.x1, p.leftLeg.y1); ctx.lineTo(p.leftLeg.x2, p.leftLeg.y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.rightLeg.x1, p.rightLeg.y1); ctx.lineTo(p.rightLeg.x2, p.rightLeg.y2); ctx.stroke();

  ctx.fillStyle = '#8B4513';
  ctx.beginPath(); ctx.arc(p.leftFoot.x, p.leftFoot.y, p.leftFoot.r, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.rightFoot.x, p.rightFoot.y, p.rightFoot.r, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#f4c2a1'; ctx.lineWidth = lw + 2;
  ctx.beginPath(); ctx.moveTo(p.leftArm.x1, p.leftArm.y1); ctx.lineTo(p.leftArm.x2, p.leftArm.y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.rightArm.x1, p.rightArm.y1); ctx.lineTo(p.rightArm.x2, p.rightArm.y2); ctx.stroke();

  ctx.fillStyle = '#f4c2a1';
  ctx.beginPath(); ctx.arc(p.leftHand.x, p.leftHand.y, p.leftHand.r, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.rightHand.x, p.rightHand.y, p.rightHand.r, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#4a7ab5';
  const bx = p.body.x - p.body.w / 2, by = p.body.y - p.body.h / 2;
  roundRect(bx, by, p.body.w, p.body.h, 8 * bob.scale); ctx.fill();

  ctx.strokeStyle = '#3a6a9f'; ctx.lineWidth = 3 * bob.scale;
  ctx.beginPath(); ctx.moveTo(bx + 4, by); ctx.lineTo(bx + 8, by - 12 * bob.scale); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + p.body.w - 4, by); ctx.lineTo(bx + p.body.w - 8, by - 12 * bob.scale); ctx.stroke();

  ctx.fillStyle = '#3a6a9f';
  roundRect(p.body.x - 7 * bob.scale, p.body.y + 5 * bob.scale, 14 * bob.scale, 12 * bob.scale, 3 * bob.scale); ctx.fill();

  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(p.body.x, p.body.y - 12 * bob.scale, 3 * bob.scale, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#f4c2a1';
  ctx.beginPath(); ctx.arc(p.head.x, p.head.y, p.head.r, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#c4926e'; ctx.lineWidth = 1.5 * bob.scale;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.arc(p.head.x, p.head.y, p.head.r - 3 * bob.scale, -0.3, 0.8); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = '#d4a040'; ctx.lineWidth = 2.5 * bob.scale; ctx.lineCap = 'round';
  for (let i = -3; i <= 3; i++) {
    const angle = -Math.PI / 2 + i * 0.2;
    const sx = p.head.x + Math.cos(angle) * (p.head.r - 2);
    const sy = p.head.y + Math.sin(angle) * (p.head.r - 2);
    const ex = p.head.x + Math.cos(angle) * (p.head.r + 8 * bob.scale) + Math.sin(bob.wobble + i) * 3;
    const ey = p.head.y + Math.sin(angle) * (p.head.r + 8 * bob.scale);
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  }

  const eyeOffX = 10 * bob.scale, eyeY = p.head.y - 3 * bob.scale;
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(p.head.x - eyeOffX, eyeY, 5 * bob.scale, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#444';
  ctx.beginPath(); ctx.arc(p.head.x - eyeOffX, eyeY, 3 * bob.scale, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1 * bob.scale;
  ctx.beginPath();
  ctx.moveTo(p.head.x - eyeOffX - 2.5 * bob.scale, eyeY - 2.5 * bob.scale);
  ctx.lineTo(p.head.x - eyeOffX + 2.5 * bob.scale, eyeY + 2.5 * bob.scale);
  ctx.moveTo(p.head.x - eyeOffX + 2.5 * bob.scale, eyeY - 2.5 * bob.scale);
  ctx.lineTo(p.head.x - eyeOffX - 2.5 * bob.scale, eyeY + 2.5 * bob.scale);
  ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(p.head.x + eyeOffX, eyeY, 5 * bob.scale, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#444';
  ctx.beginPath(); ctx.arc(p.head.x + eyeOffX, eyeY, 3 * bob.scale, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1 * bob.scale;
  ctx.beginPath();
  ctx.moveTo(p.head.x + eyeOffX - 2.5 * bob.scale, eyeY - 2.5 * bob.scale);
  ctx.lineTo(p.head.x + eyeOffX + 2.5 * bob.scale, eyeY + 2.5 * bob.scale);
  ctx.moveTo(p.head.x + eyeOffX + 2.5 * bob.scale, eyeY - 2.5 * bob.scale);
  ctx.lineTo(p.head.x + eyeOffX - 2.5 * bob.scale, eyeY + 2.5 * bob.scale);
  ctx.stroke();

  ctx.strokeStyle = '#c4926e'; ctx.lineWidth = 2 * bob.scale;
  ctx.setLineDash([2, 3]);
  ctx.beginPath(); ctx.arc(p.head.x + 2 * bob.scale, p.head.y + 6 * bob.scale, 8 * bob.scale, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#e88';
  ctx.beginPath(); ctx.arc(p.nose.x, p.nose.y, p.nose.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#c66'; ctx.lineWidth = 1; ctx.stroke();

  ctx.fillStyle = 'rgba(255, 150, 150, 0.3)';
  ctx.beginPath(); ctx.arc(p.head.x - 16 * bob.scale, p.head.y + 4 * bob.scale, 6 * bob.scale, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.head.x + 20 * bob.scale, p.head.y + 4 * bob.scale, 6 * bob.scale, 0, Math.PI * 2); ctx.fill();

  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Border spikes (screen-fixed: top and bottom only — left wall is the moving death wall)
const spikes = [];
function createSpikes() {
  spikes.length = 0;
  for (let x = 40; x < canvas.width; x += 60)
    spikes.push({ x, y: canvas.height, w: 20, baseH: 25, phase: Math.random() * Math.PI * 2, dir: 'up' });
  for (let x = 70; x < canvas.width; x += 60)
    spikes.push({ x, y: 0, w: 20, baseH: 25, phase: Math.random() * Math.PI * 2, dir: 'down' });
}

function getSpikeH(s) {
  const pulse = Math.max(0, Math.sin(gameTime * 0.022 + s.phase));
  return s.baseH + (8 + getDiff() * 35) * pulse;
}

function drawSpikes() {
  ctx.lineWidth = 1;
  for (const s of spikes) {
    const h = getSpikeH(s);
    const pulse = (h - s.baseH) / (s.baseH + 43);
    const r = Math.round(180 + pulse * 75), g = Math.round(50 - pulse * 50);
    ctx.fillStyle = `rgb(${r},${g},30)`;
    ctx.strokeStyle = `rgb(${Math.round(r * 0.6)},0,0)`;
    ctx.beginPath();
    if (s.dir === 'up') {
      ctx.moveTo(s.x - s.w / 2, s.y); ctx.lineTo(s.x, s.y - h); ctx.lineTo(s.x + s.w / 2, s.y);
    } else if (s.dir === 'down') {
      ctx.moveTo(s.x - s.w / 2, s.y); ctx.lineTo(s.x, s.y + h); ctx.lineTo(s.x + s.w / 2, s.y);
    } else if (s.dir === 'right') {
      ctx.moveTo(s.x, s.y - s.w / 2); ctx.lineTo(s.x + h, s.y); ctx.lineTo(s.x, s.y + s.w / 2);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

// World obstacles — generated per level
const obstacles = [];

function getDiff() { return getLevelDiff(currentLevel); }

function generateLevelObstacles() {
  obstacles.length = 0;
  const count = getLevelObstacleCount(currentLevel);
  const diff = getDiff();
  const safeStart = levelStartWorldX + 700;
  const safeEnd = getLevelEndX() - 500;
  const zoneW = safeEnd - safeStart;
  const oscAmp = diff * canvas.height * 0.18;
  const oscSpeed = 0.007 + diff * 0.018;

  for (let i = 0; i < count; i++) {
    const spacing = zoneW / count;
    const worldX = safeStart + i * spacing + spacing * 0.2 + Math.random() * spacing * 0.6;
    const phase = Math.random() * Math.PI * 2;
    const rand = Math.random();
    let type = 'pillar';
    if (diff > 0.15 && rand < 0.28) type = 'drop';
    else if (diff > 0.15 && rand < 0.5) type = 'rise';
    else if (diff > 0.35 && rand < 0.65) type = 'hbar';

    let obs = { worldX, type, oscAmp, oscSpeed, phase };
    if (type === 'pillar') {
      const gapSize = Math.max(160, 420 - diff * 255);
      const margin = gapSize / 2 + 35;
      obs.gapCenter = margin + Math.random() * (canvas.height - margin * 2);
      obs.gapHalfSize = gapSize / 2;
      obs.width = 32;
    } else if (type === 'drop') {
      obs.depth = 90 + diff * 130 + Math.random() * 70;
      obs.width = 52;
      obs.oscAmp = diff * canvas.height * 0.08;
    } else if (type === 'rise') {
      obs.depth = 90 + diff * 130 + Math.random() * 70;
      obs.width = 52;
      obs.oscAmp = diff * canvas.height * 0.08;
    } else if (type === 'hbar') {
      const minY = canvas.height * 0.2, maxY = canvas.height * 0.8;
      obs.barY = minY + Math.random() * (maxY - minY);
      obs.barH = 18 + diff * 22;
      obs.barW = 90 + Math.random() * 80;
      obs.oscAmp = diff * canvas.height * 0.22;
      obs.oscSpeed = oscSpeed * 1.3;
    }
    obstacles.push(obs);
  }
  obstacles.sort((a, b) => a.worldX - b.worldX);
}

function getGapCenter(obs) {
  return obs.gapCenter + obs.oscAmp * Math.sin(gameTime * obs.oscSpeed + obs.phase);
}

function getLiveDepth(obs) {
  return obs.depth + obs.oscAmp * Math.abs(Math.sin(gameTime * obs.oscSpeed + obs.phase));
}

function getLiveBarY(obs) {
  return obs.barY + obs.oscAmp * Math.sin(gameTime * obs.oscSpeed + obs.phase);
}

function drawPillarSpikes(cx, y, width, dir) {
  const sw = 16, sh = 20;
  ctx.fillStyle = '#c33'; ctx.strokeStyle = '#900'; ctx.lineWidth = 1;
  for (let sx = cx - width / 2 + sw / 2; sx <= cx + width / 2; sx += sw) {
    ctx.beginPath();
    if (dir === 'down') {
      ctx.moveTo(sx - sw / 2, y); ctx.lineTo(sx, y + sh); ctx.lineTo(sx + sw / 2, y);
    } else {
      ctx.moveTo(sx - sw / 2, y); ctx.lineTo(sx, y - sh); ctx.lineTo(sx + sw / 2, y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function drawObstacles() {
  for (const obs of obstacles) {
    const sx = obs.worldX - cameraX;
    if (sx < -100 || sx > canvas.width + 100) continue;
    const diff = getDiff();
    const shade = Math.round(30 + diff * 30);
    ctx.fillStyle = `rgb(${shade + 10},${shade / 2},${shade / 2})`;

    if (obs.type === 'pillar') {
      const gc = getGapCenter(obs);
      const topH = gc - obs.gapHalfSize, bottomY = gc + obs.gapHalfSize;
      const hw = obs.width / 2;
      if (topH > 0) { ctx.fillRect(sx - hw, 0, obs.width, topH); drawPillarSpikes(sx, topH, obs.width, 'down'); }
      if (bottomY < canvas.height) { ctx.fillRect(sx - hw, bottomY, obs.width, canvas.height - bottomY); drawPillarSpikes(sx, bottomY, obs.width, 'up'); }

    } else if (obs.type === 'drop') {
      const d = getLiveDepth(obs), hw = obs.width / 2;
      ctx.fillRect(sx - hw, 0, obs.width, d);
      drawPillarSpikes(sx, d, obs.width, 'down');

    } else if (obs.type === 'rise') {
      const d = getLiveDepth(obs), hw = obs.width / 2;
      ctx.fillRect(sx - hw, canvas.height - d, obs.width, d);
      drawPillarSpikes(sx, canvas.height - d, obs.width, 'up');

    } else if (obs.type === 'hbar') {
      const by = getLiveBarY(obs), hw = obs.barW / 2, hh = obs.barH / 2;
      ctx.fillRect(sx - hw, by - hh, obs.barW, obs.barH);
      drawPillarSpikes(sx, by - hh, obs.barW, 'up');
      drawPillarSpikes(sx, by + hh, obs.barW, 'down');
    }
  }
}

function checkObstacleCollision() {
  if (!bob.alive) return;
  const p = getBobParts();
  const sx = getScreenX();
  const pts = [
    { x: p.head.x, y: p.head.y - p.head.r },
    { x: p.head.x, y: p.head.y + p.head.r },
    { x: p.leftFoot.x, y: p.leftFoot.y + p.leftFoot.r },
    { x: p.rightFoot.x, y: p.rightFoot.y + p.rightFoot.r },
    { x: p.leftHand.x - p.leftHand.r, y: p.leftHand.y },
    { x: p.rightHand.x + p.rightHand.r, y: p.rightHand.y },
    { x: sx, y: bob.y },
  ];
  const reach = 20; // spike reach beyond block edge

  for (const obs of obstacles) {
    const obsSX = obs.worldX - cameraX;

    if (obs.type === 'pillar') {
      const hw = obs.width / 2 + reach;
      const gc = getGapCenter(obs);
      const topKill = gc - obs.gapHalfSize + reach;
      const bottomKill = gc + obs.gapHalfSize - reach;
      for (const pt of pts) {
        if (Math.abs(pt.x - obsSX) > hw) continue;
        if (pt.y < topKill || pt.y > bottomKill) { killBob(); return; }
      }

    } else if (obs.type === 'drop') {
      const hw = obs.width / 2 + reach;
      const killY = getLiveDepth(obs) + reach;
      for (const pt of pts) {
        if (Math.abs(pt.x - obsSX) > hw) continue;
        if (pt.y < killY) { killBob(); return; }
      }

    } else if (obs.type === 'rise') {
      const hw = obs.width / 2 + reach;
      const killY = canvas.height - getLiveDepth(obs) - reach;
      for (const pt of pts) {
        if (Math.abs(pt.x - obsSX) > hw) continue;
        if (pt.y > killY) { killBob(); return; }
      }

    } else if (obs.type === 'hbar') {
      const hw = obs.barW / 2 + reach;
      const by = getLiveBarY(obs);
      const topKill = by - obs.barH / 2 - reach;
      const bottomKill = by + obs.barH / 2 + reach;
      for (const pt of pts) {
        if (Math.abs(pt.x - obsSX) > hw) continue;
        if (pt.y > topKill && pt.y < bottomKill) { killBob(); return; }
      }
    }
  }
}

// Border spike collision (screen-space, no right wall)
function checkSpikeCollision() {
  if (!bob.alive) return;
  const p = getBobParts();
  const sx = getScreenX();
  const testPoints = [
    { x: p.head.x, y: p.head.y - p.head.r },
    { x: p.head.x, y: p.head.y + p.head.r },
    { x: p.leftFoot.x, y: p.leftFoot.y + p.leftFoot.r },
    { x: p.rightFoot.x, y: p.rightFoot.y + p.rightFoot.r },
    { x: p.leftHand.x - p.leftHand.r, y: p.leftHand.y },
    { x: p.rightHand.x + p.rightHand.r, y: p.rightHand.y },
    { x: sx, y: bob.y },
  ];
  for (const s of spikes) {
    const h = getSpikeH(s);
    for (const pt of testPoints) {
      let hit = false;
      if (s.dir === 'up'    && pt.y > s.y - h && pt.y < s.y && Math.abs(pt.x - s.x) < s.w) hit = true;
      if (s.dir === 'down'  && pt.y < s.y + h && pt.y > s.y && Math.abs(pt.x - s.x) < s.w) hit = true;
      if (s.dir === 'right' && pt.x < s.x + h && pt.x > s.x && Math.abs(pt.y - s.y) < s.w / 2) hit = true;
      if (hit) { killBob(); return; }
    }
  }
}

// Particles
const particles = [];
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2, speed = 1 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, decay: 0.01 + Math.random() * 0.02, size: 2 + Math.random() * 5, color });
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Score / lives
let gameTime = 0;
let bestMaxWorldX = parseFloat(localStorage.getItem('bobBestWorldX') || '0');
let lives = 3;
let gameOver = false;
let newRecord = false;

// Title screen
let titleScreen = true;
let titleTime = 0;
let showLevelsScreen = false;

// Level system
const LEVEL_LENGTH = 5200;
let currentLevel = 1;
let levelStartWorldX = 0;
let totalTimer = 300 * 60; // 5 minutes in frames
let levelsBeaten = JSON.parse(localStorage.getItem('bobLevelsBeaten') || '[]');

function getLevelEndX() { return levelStartWorldX + LEVEL_LENGTH; }
function getLevelObstacleCount(level) { return Math.min(Math.pow(2, level - 1), 32); }
function getLevelDiff(level) { return Math.min(1, (level - 1) / 14); }

function getDistanceM() { return Math.floor(Math.max(0, bob.worldX) / 20); }
function getBestDistanceM() { return Math.floor(bestMaxWorldX / 20); }

// Kill / respawn
function killBob() {
  bob.alive = false; dragging = false;
  if (bob.worldX > bestMaxWorldX) {
    bestMaxWorldX = bob.worldX;
    newRecord = true;
    localStorage.setItem('bobBestWorldX', bestMaxWorldX);
  }
  lives--;
  bob.respawnTimer = lives <= 0 ? 999999 : 90;
  if (lives <= 0) gameOver = true;
  const sx = getScreenX();
  spawnParticles(sx, bob.y, '#f4c2a1', 20);
  spawnParticles(sx, bob.y, '#4a7ab5', 15);
  spawnParticles(sx, bob.y, '#d4a040', 10);
  playPop();
}

function respawnBob() {
  bob.worldX = cameraX + canvas.width * 0.35;
  bob.y = canvas.height / 2;
  bob.vx = 0; bob.vy = 0; bob.alive = true; bob.opacity = 1; bob.scale = 1;
  // Push wall back to give breathing room after death
  deathWallWorldX = Math.min(deathWallWorldX, bob.worldX - canvas.width * 0.45);
  const sx = getScreenX();
  spawnParticles(sx, bob.y, '#fff', 15);
  spawnParticles(sx, bob.y, '#aaf', 10);
  playRespawn();
}

function restartGame() {
  lives = 3; gameTime = 0; gameOver = false; newRecord = false;
  totalTimer = 300 * 60;
  currentLevel = 1;
  cameraX = 0;
  bob.worldX = canvas.width * 0.35;
  bob.y = canvas.height / 2;
  bob.vx = 0; bob.vy = 0; bob.alive = true; bob.opacity = 1; bob.scale = 1;
  levelStartWorldX = bob.worldX - 300;
  deathWallWorldX = bob.worldX - canvas.width * 0.45;
  generateLevelObstacles();
}

// Nose squeak visual
let squeakTimer = 0;

// Input
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

// Dragging — offset stored in world space
let dragging = false;
let dragOffX = 0, dragOffY = 0;

function hitTestBob(mx, my) {
  if (!bob.alive) return false;
  const p = getBobParts();
  const dx = mx - p.head.x, dy = my - p.head.y;
  if (dx * dx + dy * dy < (p.head.r + 10) * (p.head.r + 10)) return true;
  const bx = p.body.x - p.body.w / 2, by = p.body.y - p.body.h / 2;
  if (mx > bx - 5 && mx < bx + p.body.w + 5 && my > by - 5 && my < by + p.body.h + 5) return true;
  for (const key of ['leftHand', 'rightHand', 'leftFoot', 'rightFoot']) {
    const part = p[key];
    if (Math.hypot(mx - part.x, my - part.y) < part.r + 10) return true;
  }
  for (const key of ['leftArm', 'rightArm', 'leftLeg', 'rightLeg']) {
    const limb = p[key];
    if (distToSegment(mx, my, limb.x1, limb.y1, limb.x2, limb.y2) < 12) return true;
  }
  return false;
}

function hitTestNose(mx, my) {
  const p = getBobParts();
  const dx = mx - p.nose.x, dy = my - p.nose.y;
  return dx * dx + dy * dy < (p.nose.r + 4) * (p.nose.r + 4);
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function onDown(e) {
  e.preventDefault();
  const { x, y } = getPos(e);

  // Music toggle button (always visible, bottom-left) — check first
  const mBtnX = 16, mBtnY = canvas.height - 70, mBtnW = 90, mBtnH = 30;
  if (x >= mBtnX && x <= mBtnX + mBtnW && y >= mBtnY && y <= mBtnY + mBtnH) {
    if (musicOn) {
      stopMusic();
      musicManuallyStopped = true;
    } else {
      musicManuallyStopped = false;
      musicStarted = false; // allow startMusic to run again
      if (audioCtx.state === 'suspended') audioCtx.resume().then(startMusic);
      else startMusic();
    }
    return;
  }

  // Auto-start music on first non-button tap
  autoStartMusic();

  if (titleScreen) {
    if (showLevelsScreen) { showLevelsScreen = false; return; }
    // Check "Levels" button on title (drawn at cx, cy + height*0.54)
    const cx = canvas.width / 2, cy = canvas.height / 2;
    const lvlBtnY = cy + canvas.height * 0.54;
    if (Math.abs(x - cx) < 90 && Math.abs(y - lvlBtnY) < 18) {
      showLevelsScreen = true; return;
    }
    titleScreen = false;
    restartGame();
    return;
  }
  if (gameOver) {
    // Check back-to-menu button
    const b = getMenuBtnBounds();
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      titleScreen = true; showLevelsScreen = false; gameOver = false; return;
    }
    restartGame(); return;
  }
  if (hitTestNose(x, y)) { playSqueak(); squeakTimer = 15; }
  if (hitTestBob(x, y)) {
    dragging = true;
    dragOffX = bob.worldX - (x + cameraX);
    dragOffY = bob.y - y;
    bob.wobbleSpeed = 0.15;
  }
}

function onMove(e) {
  e.preventDefault();
  if (!dragging) return;
  const { x, y } = getPos(e);
  const newWorldX = (x + cameraX) + dragOffX;
  const newY = y + dragOffY;
  bob.vx = (newWorldX - bob.worldX) * 0.5;
  bob.vy = (newY - bob.y) * 0.5;
  bob.worldX = newWorldX;
  bob.y = newY;
}

function onUp() { dragging = false; }

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('mouseleave', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onUp);

// Background (scrolling grid)
function drawBackground() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const gs = 80;
  const offX = cameraX % gs;
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
  for (let x = -offX; x < canvas.width + gs; x += gs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += gs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
  // Danger border (top and bottom only — left wall is the death wall)
  ctx.fillStyle = '#2a1a1a';
  ctx.fillRect(0, 0, canvas.width, 8);
  ctx.fillRect(0, canvas.height - 8, canvas.width, 8);
}

// HUD
function drawHUD() {
  const best = getBestDistanceM();
  const diff = getDiff();

  // Lives
  ctx.textAlign = 'left'; ctx.font = '20px monospace';
  ctx.fillStyle = 'rgba(255,80,80,0.9)';
  ctx.fillText('♥'.repeat(Math.max(0, lives)), 35, 65);

  // Level (center top)
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = 'bold 22px monospace';
  ctx.fillText(`LEVEL ${currentLevel}`, canvas.width / 2, 52);

  // Timer
  const totalSec = Math.ceil(totalTimer / 60);
  const tMin = Math.floor(totalSec / 60);
  const tSec = totalSec % 60;
  const timerStr = `${tMin}:${tSec.toString().padStart(2,'0')}`;
  const timerAlpha = totalTimer < 1800 ? (0.5 + 0.5 * Math.abs(Math.sin(gameTime * 0.1))) : 0.85;
  ctx.fillStyle = totalTimer < 1800 ? `rgba(255,80,80,${timerAlpha})` : `rgba(255,255,255,${timerAlpha})`;
  ctx.font = 'bold 18px monospace';
  ctx.fillText(timerStr, canvas.width / 2, 76);

  if (bestMaxWorldX > 0) {
    ctx.fillStyle = 'rgba(255,215,0,0.55)'; ctx.font = '12px monospace';
    ctx.fillText(`best ${best}m`, canvas.width / 2, 94);
  }

  if (diff > 0.05) {
    const label = diff < 0.33 ? 'warming up' : diff < 0.66 ? 'getting spiky' : 'DANGER ZONE';
    ctx.textAlign = 'right';
    ctx.fillStyle = `rgba(255,${Math.round(200 - diff * 180)},30,0.8)`;
    ctx.font = 'bold 13px monospace';
    ctx.fillText(label, canvas.width - 35, 65);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '13px monospace';
  ctx.textAlign = 'left'; ctx.fillText('drag Bob · click nose', 35, canvas.height - 40);
  ctx.textAlign = 'right'; ctx.fillText('avoid spikes!', canvas.width - 35, canvas.height - 40);

  // Music toggle button — bottom left
  const btnLabel = musicOn ? '🔊 music' : '🔇 music';
  const btnW = 90, btnH = 30, btnX = 16, btnY = canvas.height - 70;
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  roundRect(btnX, btnY, btnW, btnH, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
  roundRect(btnX, btnY, btnW, btnH, 8); ctx.stroke();
  ctx.fillStyle = musicOn ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.35)';
  ctx.font = '13px monospace'; ctx.textAlign = 'center';
  ctx.fillText(btnLabel, btnX + btnW / 2, btnY + btnH / 2 + 5);

  // Distance into level
  const levelPct = Math.max(0, Math.min(1, (bob.worldX - levelStartWorldX) / LEVEL_LENGTH));
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '12px monospace';
  ctx.fillText(`${Math.round(levelPct * 100)}%`, 35, 90);

  if (squeakTimer > 0) {
    const sx = getScreenX();
    ctx.fillStyle = `rgba(255,200,100,${squeakTimer / 15})`;
    ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SQUEAK!', sx, bob.y - 100 * bob.scale);
  }

  if (gameOver) {
    const cx = canvas.width / 2, cy = canvas.height / 2;

    // Dim backdrop
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Card background
    const cardW = 380, cardH = newRecord ? 230 : 200;
    ctx.fillStyle = '#0d1b2a';
    roundRect(cx - cardW / 2, cy - cardH / 2, cardW, cardH, 16);
    ctx.fill();
    ctx.strokeStyle = newRecord ? '#ffd700' : '#3a3a5a';
    ctx.lineWidth = newRecord ? 2.5 : 1.5;
    roundRect(cx - cardW / 2, cy - cardH / 2, cardW, cardH, 16);
    ctx.stroke();

    ctx.textAlign = 'center';

    // Title
    ctx.fillStyle = '#ff5555'; ctx.font = 'bold 42px monospace';
    ctx.fillText('GAME OVER', cx, cy - cardH / 2 + 52);

    // New record flash
    if (newRecord) {
      ctx.fillStyle = '#ffd700'; ctx.font = 'bold 16px monospace';
      ctx.fillText('★  NEW RECORD  ★', cx, cy - cardH / 2 + 82);
    }

    // Best distance
    const yOff = newRecord ? 28 : 10;
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = 'bold 28px monospace';
    ctx.fillText(`${best}m`, cx, cy - cardH / 2 + 118 + yOff);

    // Saved badge
    ctx.fillStyle = 'rgba(80,200,120,0.85)'; ctx.font = '13px monospace';
    ctx.fillText('✓  saved to this device', cx, cy - cardH / 2 + 145 + yOff);

    // Play again prompt
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '15px monospace';
    ctx.fillText('tap anywhere to play again', cx, cy - cardH / 2 + 178 + yOff);

    // Back to menu button
    const btnY = cy - cardH / 2 + 205 + yOff;
    const btnW = 180, btnH = 32;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    roundRect(cx - btnW / 2, btnY - btnH / 2, btnW, btnH, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
    roundRect(cx - btnW / 2, btnY - btnH / 2, btnW, btnH, 8); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '14px monospace';
    ctx.fillText('← back to menu', cx, btnY + 5);
  }
}

// Store game-over button bounds for hit testing
function getMenuBtnBounds() {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const cardH = newRecord ? 230 : 200;
  const yOff = newRecord ? 28 : 10;
  const btnY = cy - cardH / 2 + 205 + yOff;
  const btnW = 180, btnH = 32;
  return { x: cx - btnW / 2, y: btnY - btnH / 2, w: btnW, h: btnH };
}

function drawLevelPortal() {
  const endX = getLevelEndX();
  const sx = endX - cameraX;
  if (sx < -80 || sx > canvas.width + 80) return;

  const pulse = 0.7 + 0.3 * Math.sin(gameTime * 0.06);
  // Wide glow
  const grad = ctx.createLinearGradient(sx - 80, 0, sx + 80, 0);
  grad.addColorStop(0, 'rgba(255,255,255,0)');
  grad.addColorStop(0.5, `rgba(220,240,255,${0.25 * pulse})`);
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(sx - 80, 0, 160, canvas.height);
  // Bright beam
  ctx.fillStyle = `rgba(255,255,255,${0.85 * pulse})`;
  ctx.fillRect(sx - 5, 0, 10, canvas.height);
  // Particles around beam
  if (Math.random() < 0.4) {
    spawnParticles(sx + (Math.random() - 0.5) * 10, Math.random() * canvas.height, '#fff', 1);
  }
  // Label
  ctx.textAlign = 'center';
  ctx.shadowBlur = 12; ctx.shadowColor = '#ffffff';
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.font = `bold ${Math.min(18, canvas.width * 0.026)}px monospace`;
  if (currentLevel < 30) {
    ctx.fillText(`LEVEL ${currentLevel + 1} →`, sx, canvas.height / 2 - 14);
  } else {
    ctx.fillText('★ FINISH ★', sx, canvas.height / 2 - 14);
  }
  ctx.shadowBlur = 0;
}

function completeLevel() {
  if (!levelsBeaten.includes(currentLevel)) {
    levelsBeaten.push(currentLevel);
    localStorage.setItem('bobLevelsBeaten', JSON.stringify(levelsBeaten));
  }
  if (currentLevel >= 30) { gameOver = true; return; }
  const nextStart = getLevelEndX();
  currentLevel++;
  levelStartWorldX = nextStart;
  gameTime = 0;
  deathWallWorldX = bob.worldX - canvas.width * 0.55;
  generateLevelObstacles();
  spawnParticles(getScreenX(), bob.y, '#ffffff', 30);
  spawnParticles(getScreenX(), bob.y, '#ffd700', 20);
  playRespawn();
}

function checkPortalCollision() {
  if (!bob.alive) return;
  if (bob.worldX >= getLevelEndX() - 60) completeLevel();
}

function drawTitleScreen() {
  // Background
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const gs = 80;
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width + gs; x += gs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += gs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  const cx = canvas.width / 2, cy = canvas.height / 2;

  // Title "GAME OF"
  ctx.textAlign = 'center';
  ctx.shadowBlur = 25; ctx.shadowColor = '#4a7ab5';
  ctx.fillStyle = 'rgba(200,220,255,0.95)';
  ctx.font = `bold ${Math.min(64, canvas.width * 0.09)}px monospace`;
  ctx.fillText('GAME OF', cx, cy - canvas.height * 0.28);
  ctx.shadowBlur = 0;

  // Title "BOB"
  const bobPulse = 1 + 0.04 * Math.sin(titleTime * 0.04);
  ctx.save();
  ctx.translate(cx, cy - canvas.height * 0.16);
  ctx.scale(bobPulse, bobPulse);
  ctx.shadowBlur = 40; ctx.shadowColor = '#ffd700';
  ctx.fillStyle = '#ffd700';
  ctx.font = `bold ${Math.min(100, canvas.width * 0.14)}px monospace`;
  ctx.fillText('BOB', 0, 0);
  ctx.shadowBlur = 0;
  ctx.restore();

  // Animated Bob character — positioned for title
  bob.wobble += 0.04;
  bob.wobbleSpeed = 0.04;
  bob.worldX = cx;
  bob.y = cy + canvas.height * 0.06;
  bob.scale = Math.min(1.3, canvas.width / 600);
  bob.alive = true;
  cameraX = 0;
  drawBob();

  // Subtitle
  ctx.fillStyle = 'rgba(160,190,255,0.65)';
  ctx.font = `${Math.min(15, canvas.width * 0.022)}px monospace`;
  ctx.fillText('drag Bob through spike-filled corridors', cx, cy + canvas.height * 0.26);
  ctx.fillText('survive as long as you can!', cx, cy + canvas.height * 0.32);

  // Best score
  if (bestMaxWorldX > 0) {
    ctx.fillStyle = 'rgba(255,215,0,0.85)';
    ctx.font = `bold ${Math.min(17, canvas.width * 0.025)}px monospace`;
    ctx.fillText(`best: ${getBestDistanceM()}m`, cx, cy + canvas.height * 0.39);
  }

  // Blinking "tap to play"
  if (Math.sin(titleTime * 0.06) > -0.3) {
    ctx.fillStyle = `rgba(255,255,255,${0.7 + 0.3 * Math.sin(titleTime * 0.06)})`;
    ctx.font = `bold ${Math.min(22, canvas.width * 0.032)}px monospace`;
    ctx.fillText('tap to play', cx, cy + canvas.height * 0.46);
  }

  // "Levels" button
  const lvlBtnY = cy + canvas.height * 0.54;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  roundRect(cx - 80, lvlBtnY - 16, 160, 32, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  roundRect(cx - 80, lvlBtnY - 16, 160, 32, 8); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '14px monospace';
  ctx.fillText('☰ levels', cx, lvlBtnY + 5);

  // Subtle red danger glow at edges
  const edgeAlpha = 0.08 + 0.04 * Math.sin(titleTime * 0.03);
  const gL = ctx.createLinearGradient(0, 0, 60, 0);
  gL.addColorStop(0, `rgba(200,0,0,${edgeAlpha})`); gL.addColorStop(1, 'rgba(200,0,0,0)');
  ctx.fillStyle = gL; ctx.fillRect(0, 0, 60, canvas.height);
  const gR = ctx.createLinearGradient(canvas.width, 0, canvas.width - 60, 0);
  gR.addColorStop(0, `rgba(200,0,0,${edgeAlpha})`); gR.addColorStop(1, 'rgba(200,0,0,0)');
  ctx.fillStyle = gR; ctx.fillRect(canvas.width - 60, 0, 60, canvas.height);

  // Music toggle (bottom left, same position as in-game)
  const mBtnW = 90, mBtnH = 30, mBtnX = 16, mBtnY = canvas.height - 70;
  const mLabel = musicOn ? '🔊 music' : '🔇 music';
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  roundRect(mBtnX, mBtnY, mBtnW, mBtnH, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
  roundRect(mBtnX, mBtnY, mBtnW, mBtnH, 8); ctx.stroke();
  ctx.fillStyle = musicOn ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.35)';
  ctx.font = '13px monospace'; ctx.textAlign = 'center';
  ctx.fillText(mLabel, mBtnX + mBtnW / 2, mBtnY + mBtnH / 2 + 5);

  // Levels screen overlay
  if (showLevelsScreen) drawLevelsScreen();

  titleTime++;
}

function drawLevelsScreen() {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 28px monospace';
  ctx.fillText('LEVELS', cx, 60);
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '13px monospace';
  ctx.fillText('tap anywhere to go back', cx, 85);

  const cols = 5, rows = 6, total = 30;
  const cellW = Math.min(80, (canvas.width - 80) / cols);
  const cellH = 50;
  const gridW = cols * cellW, gridH = rows * cellH;
  const startX = cx - gridW / 2, startY = 110;

  for (let i = 0; i < total; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * cellW, y = startY + row * cellH;
    const beaten = levelsBeaten.includes(i + 1);
    ctx.fillStyle = beaten ? 'rgba(80,200,120,0.2)' : 'rgba(255,255,255,0.06)';
    roundRect(x + 4, y + 4, cellW - 8, cellH - 8, 6); ctx.fill();
    ctx.strokeStyle = beaten ? 'rgba(80,200,120,0.6)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    roundRect(x + 4, y + 4, cellW - 8, cellH - 8, 6); ctx.stroke();
    ctx.fillStyle = beaten ? '#80c880' : 'rgba(255,255,255,0.6)';
    ctx.font = `bold ${Math.min(15, cellW * 0.22)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`${i + 1}`, x + cellW / 2, y + cellH / 2 - 2);
    if (beaten) {
      ctx.fillStyle = '#ffd700'; ctx.font = '12px monospace';
      ctx.fillText('★', x + cellW / 2, y + cellH / 2 + 14);
    }
    const obsCount = getLevelObstacleCount(i + 1);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '10px monospace';
    ctx.fillText(`${obsCount} obs`, x + cellW / 2, y + cellH - 6);
  }
}

// Main loop
function update() {
  if (gameOver) { updateParticles(); return; }
  if (!bob.alive) {
    bob.respawnTimer--;
    if (bob.respawnTimer <= 0) respawnBob();
    if (squeakTimer > 0) squeakTimer--;
    updateParticles();
    return;
  }

  gameTime++;

  if (!dragging) {
    bob.vx *= 0.98; bob.vy *= 0.98;
    bob.worldX += bob.vx; bob.y += bob.vy;
    bob.wobbleSpeed *= 0.96;
  } else {
    bob.wobbleSpeed = Math.min(bob.wobbleSpeed, 0.3);
  }
  bob.wobble += bob.wobbleSpeed;

  updateCamera();
  // Wall tracks Bob's furthest-forward position at a fixed offset.
  // When Bob moves forward the wall advances with him.
  // When Bob moves backward the wall stays — he just gets closer to it.
  const wallTrail = canvas.width * 0.45;
  deathWallWorldX = Math.max(deathWallWorldX, bob.worldX - wallTrail);
  if (bob.worldX < deathWallWorldX + 38) { killBob(); return; }
  // Global 5-minute countdown
  if (totalTimer > 0) { totalTimer--; }
  else { killBob(); return; }
  checkPortalCollision();
  checkSpikeCollision();
  checkObstacleCollision();

  if (squeakTimer > 0) squeakTimer--;
  updateParticles();
}

function draw() {
  drawBackground();
  drawDeathWall();
  drawLevelPortal();
  drawObstacles();
  drawSpikes();
  drawBob();
  drawParticles();
  drawHUD();
}

function loop() {
  if (titleScreen) {
    drawTitleScreen();
    requestAnimationFrame(loop);
    return;
  }
  update(); draw(); requestAnimationFrame(loop);
}

resizeCanvas();
bob.worldX = canvas.width * 0.35;
bob.y = canvas.height / 2;
levelStartWorldX = bob.worldX - 300;
deathWallWorldX = bob.worldX - canvas.width * 0.45;
generateLevelObstacles();
loop();
</script>
